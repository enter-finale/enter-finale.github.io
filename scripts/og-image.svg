<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#e9e4d8"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070711"/>
      <stop offset="0.6" stop-color="#160c26"/>
      <stop offset="1" stop-color="#3a1120"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 左：メール画面 -->
  <rect width="600" height="630" fill="url(#bgL)"/>
  <g transform="translate(70 120)">
    <rect x="0" y="0" width="470" height="390" rx="18" fill="#ffffff" stroke="#e4dfd3" stroke-width="2"/>
    <text x="28" y="44" font-family="Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif" font-size="18" fill="#7a776f">宛先: お取引先様</text>
    <line x1="28" y1="62" x2="442" y2="62" stroke="#e4dfd3" stroke-width="2"/>
    <text x="28" y="120" font-family="Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif" font-size="30" fill="#24231f">誠に申し訳ございません。</text>
    <rect x="392" y="125" width="3" height="34" fill="#2f6fed"/>
    <line x1="28" y1="330" x2="442" y2="330" stroke="#e4dfd3" stroke-width="2"/>
    <rect x="352" y="344" width="90" height="34" rx="8" fill="#2f6fed"/>
    <text x="397" y="368" text-anchor="middle" font-family="Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif" font-size="17" font-weight="700" fill="#ffffff">送信</text>
  </g>
  <!-- キーボード -->
  <g transform="translate(330 540)" opacity="0.9">
    <rect x="-90" y="-16" width="180" height="40" rx="6" fill="#2a2a2e"/>
    <rect x="-82" y="-9" width="164" height="26" rx="4" fill="#3b3b42"/>
    <text x="0" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Enter ⏎</text>
  </g>

  <!-- 右：ステージ -->
  <rect x="600" width="600" height="630" fill="url(#bgR)"/>
  <polygon points="700,0 560,630 840,630" fill="url(#beam)"/>
  <polygon points="900,0 760,630 1040,630" fill="url(#beam2)"/>
  <polygon points="1100,0 960,630 1240,630" fill="url(#beam3)"/>
  <!-- ドラム -->
  <g transform="translate(900 400)">
    <rect x="-150" y="30" width="300" height="24" rx="4" fill="#1c1c22"/>
    <g transform="translate(95 -5)"><rect x="-40" y="-26" width="80" height="60" rx="5" fill="#8b1e2d"/><ellipse cx="0" cy="-26" rx="40" ry="10" fill="#f3eee4"/></g>
    <g transform="translate(-38 -56)"><rect x="-32" y="-20" width="64" height="44" rx="5" fill="#8b1e2d"/><ellipse cx="0" cy="-20" rx="32" ry="9" fill="#f3eee4"/></g>
    <g transform="translate(38 -60)"><rect x="-36" y="-22" width="72" height="48" rx="5" fill="#8b1e2d"/><ellipse cx="0" cy="-22" rx="36" ry="10" fill="#f3eee4"/></g>
    <g transform="translate(-105 -2)"><rect x="-34" y="-16" width="68" height="30" rx="4" fill="#d9d2c4"/><ellipse cx="0" cy="-16" rx="34" ry="9" fill="#f6f2ea"/></g>
    <circle cx="0" cy="0" r="54" fill="#8b1e2d"/><circle cx="0" cy="0" r="43" fill="#f3eee4"/>
    <ellipse cx="-100" cy="-105" rx="50" ry="9" fill="#e8c860"/>
    <ellipse cx="105" cy="-100" rx="56" ry="10" fill="#e8c860"/>
    <line x1="-100" y1="-105" x2="-125" y2="30" stroke="#9aa0ad" stroke-width="3"/>
    <line x1="105" y1="-100" x2="130" y2="30" stroke="#9aa0ad" stroke-width="3"/>
  </g>
  <!-- ギター -->
  <g transform="translate(690 330) rotate(-30)">
    <path d="M-40,-10 C-70,-30 -70,30 -40,45 C-25,55 -5,55 10,45 C30,35 40,20 42,0 C44,-25 25,-45 0,-45 C-20,-45 -32,-30 -40,-10 Z" fill="#c9742a" stroke="#4a2a10" stroke-width="3"/>
    <rect x="-150" y="-7" width="125" height="14" rx="3" fill="#3b2412"/>
  </g>
  <!-- アンプ -->
  <g transform="translate(1110 460)">
    <rect x="-60" y="-100" width="120" height="100" rx="4" fill="#15151a" stroke="#2e2e38" stroke-width="2"/>
    <g fill="none" stroke="#3b3b47" stroke-width="2"><circle cx="-26" cy="-70" r="18"/><circle cx="26" cy="-70" r="18"/><circle cx="-26" cy="-30" r="18"/><circle cx="26" cy="-30" r="18"/></g>
    <rect x="-56" y="-142" width="112" height="38" rx="3" fill="#15151a" stroke="#2e2e38" stroke-width="2"/>
    <rect x="-50" y="-136" width="100" height="16" rx="2" fill="#d4b465"/>
  </g>
  <!-- 観客 -->
  <g fill="#06060a">
    <g transform="translate(640 630)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M-18,-66 C-30,-90 -38,-110 -40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M18,-66 C30,-90 38,-110 40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(740 640)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M-18,-66 C-30,-90 -38,-110 -40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(850 635)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M18,-66 C30,-90 38,-110 40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(960 642)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M-18,-66 C-30,-90 -38,-110 -40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M18,-66 C30,-90 38,-110 40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(1070 636)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M18,-66 C30,-90 38,-110 40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(1170 640)"><ellipse cx="0" cy="-30" rx="30" ry="48"/><circle cx="0" cy="-88" r="20"/><path d="M-18,-66 C-30,-90 -38,-110 -40,-130" stroke="#06060a" stroke-width="9" fill="none" stroke-linecap="round"/></g>
  </g>

  <!-- 中央の矢印 -->
  <g transform="translate(600 315)">
    <circle cx="0" cy="0" r="46" fill="#ffd166" stroke="#1a1206" stroke-width="4"/>
    <path d="M-16,-16 L10,0 L-16,16 Z" fill="#1a1206"/>
  </g>

  <!-- タイトル -->
  <rect x="0" y="40" width="1200" height="0" fill="none"/>
  <text x="600" y="92" text-anchor="middle" font-family="Impact, Arial Black, Segoe UI, sans-serif" font-size="76" font-weight="900" fill="#ffffff" stroke="#1a1206" stroke-width="8" paint-order="stroke" letter-spacing="6">ENTER FINALE</text>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#ffffff" stroke="#1a1206" stroke-width="6" paint-order="stroke">文章を打って、Enterでライブ終了。</text>
</svg>
