<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>ENTER FINALE</title>
    <!-- URL を貼ったときにサムネや説明文が出ないよう、OGP / description は意図的に入れていない -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app" data-state="ready">
      <header id="topbar">
        <div class="topbar-left">
          <span class="topbar-title">新規メッセージ</span>
        </div>
        <div class="topbar-right controls">
          <span id="status" class="status" hidden></span>
          <label class="volume" title="音量">
            <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="音量" />
          </label>
          <button id="mute" type="button" class="icon-btn" aria-label="ミュート" aria-pressed="false">🔊</button>
        </div>
      </header>

      <main id="composer" class="composer">
        <div class="composer-card">
          <div class="composer-meta">
            <span class="meta-label">宛先</span><span class="meta-value">お取引先様</span>
          </div>
          <textarea
            id="message"
            class="message"
            placeholder="ここにメッセージを入力..."
            rows="6"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="send"
          ></textarea>
          <div class="composer-actions">
            <span class="composer-hint"><kbd>Enter</kbd> で送信 / <kbd>Shift</kbd>+<kbd>Enter</kbd> で改行</span>
            <button id="send" type="button" class="send-btn">送信</button>
          </div>
        </div>
      </main>

      <div id="stage" class="stage" aria-hidden="true">
        <img id="stage-photo" class="stage-photo" alt="" decoding="async" />
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>

      <div id="finale-layer" class="finale-layer">
        <section id="banner" class="banner" data-size="md" aria-live="polite">
          <p id="banner-text" class="banner-text"></p>
        </section>
        <div id="finale-controls" class="finale-controls">
          <button id="replay" type="button" class="btn btn-primary">もう一度演奏する</button>
        </div>
      </div>

      <div id="audio-unlock" class="audio-unlock" hidden>
        <button id="audio-unlock-btn" type="button" class="btn btn-primary">🔊 音を有効にする</button>
        <p>ブラウザの設定により音声が止められています。タップして有効にしてください。</p>
      </div>

      <details id="settings" class="settings"></details>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
