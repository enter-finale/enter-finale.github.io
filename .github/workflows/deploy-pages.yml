# GitHub Pages へのデプロイ（リポジトリの Settings > Pages で Source を "GitHub Actions" にしてから有効化）
# BASE_PATH はリポジトリ名から自動で組み立てます（<owner>.github.io ならルート、それ以外はサブパス）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # リポジトリ名が <owner>.github.io ならルート (https://<owner>.github.io/)、
      # それ以外はサブパス (https://<owner>.github.io/<repo>/) で公開する
      - name: Resolve base path
        id: url
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$REPO" = "${owner}.github.io" ]; then
            base="/"
          else
            base="/${REPO}/"
          fi
          echo "base_path=${base}" >> "$GITHUB_OUTPUT"
          echo "BASE_PATH=${base}"
      - name: Build
        env:
          BASE_PATH: ${{ steps.url.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
